name: warm

# Render free instances sleep after ~15 minutes idle and then take 30-60s to wake.
# A cheap hit every 10 minutes keeps the API warm for real visitors.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Health
        run: |
          curl -fsS --retry 3 --retry-delay 5 --max-time 90 \
            https://onyxchin-api.onrender.com/api/health
      - name: Warm home rows
        run: |
          for src in rajadonghua anichin animexin donghuaworld; do
            curl -fsS --max-time 90 "https://onyxchin-api.onrender.com/api/$src/home" >/dev/null || true
            sleep 2
          done
